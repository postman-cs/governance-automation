name: API Governance Check

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'specs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'specs/**'
  workflow_dispatch:
    inputs:
      governance_threshold:
        description: 'Governance Threshold (0-100)'
        required: false
        default: '70'
        type: choice
        options:
          - '50'
          - '60'
          - '70'
          - '80'
          - '90'
      governance_mode:
        description: 'Governance Mode (specs or apis)'
        required: false
        default: 'specs'
        type: choice
        options:
          - 'specs'
          - 'apis'

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  GOVERNANCE_THRESHOLD: ${{ github.event.inputs.governance_threshold || vars.GOVERNANCE_THRESHOLD || '70' }}
  GOVERNANCE_MODE: ${{ github.event.inputs.governance_mode || vars.GOVERNANCE_MODE || 'specs' }}
  FAIL_ON_GOVERNANCE_VIOLATIONS: ${{ vars.FAIL_ON_GOVERNANCE_VIOLATIONS || 'true' }}

jobs:
  governance-check:
    name: API Governance Check
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install Postman CLI
        run: |
          # Use the Linux64 installer which is more stable
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          echo "$HOME/.postman/bin" >> $GITHUB_PATH
          
          # Verify installation
          echo "Verifying Postman installation..."
          postman -v
          
      - name: Install dependencies
        run: |
          npm install
          
      - name: Install jq for JSON processing
        run: |
          # Fast binary download (no apt-get needed)
          wget -O jq https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64
          chmod +x jq
          sudo mv jq /usr/local/bin/
          jq --version
          
      - name: Login to Postman
        run: |
          postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
          
      - name: Sync to Postman
        id: sync
        run: |
          if [ "${{ env.GOVERNANCE_MODE }}" = "apis" ]; then
            echo "Syncing API specifications to Postman APIs..."
            node scripts/sync_apis_to_postman.js sync-all
          else
            echo "Syncing API specifications to Postman Spec Hub..."
            node scripts/sync_specs_to_postman.js sync-all
          fi
        continue-on-error: true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
          
      - name: Run Governance Quality Gate
        id: governance-check
        run: |
          # Score using workspace-based governance
          export POSTMAN_API_KEY=${{ secrets.POSTMAN_API_KEY }}
          
          if [ "${{ env.GOVERNANCE_MODE }}" = "apis" ]; then
            echo "Running governance check on APIs (generating both JSON and HTML)..."
            # Generate both API governance report and dashboard in single run
            node scripts/postman_governance-api.js \
              --workspace ${{ vars.WORKSPACE_ID }} \
              --threshold ${{ env.GOVERNANCE_THRESHOLD }}
          else
            echo "Running governance check on specs (generating both JSON and HTML)..."
            # Generate both spec governance report and dashboard in single run
            node scripts/postman_governance-spec.js \
              --workspace ${{ vars.WORKSPACE_ID }} \
              --threshold ${{ env.GOVERNANCE_THRESHOLD }}
          fi
          
          # Check for failures
          failed_count=$(cat governance-report.json | jq '[.[] | select(.status == "FAIL")] | length')
          total_count=$(cat governance-report.json | jq '. | length')
          
          echo "Governance Report: $failed_count/$total_count APIs failed"
          echo "failed_count=$failed_count" >> $GITHUB_OUTPUT
          echo "total_count=$total_count" >> $GITHUB_OUTPUT
          
          # Calculate passed count for later use
          passed_count=$((total_count - failed_count))
          echo "passed_count=$passed_count" >> $GITHUB_OUTPUT
          
          if [ "$failed_count" -gt 0 ] && [ "${{ env.FAIL_ON_GOVERNANCE_VIOLATIONS }}" = "true" ]; then
            echo "[FAILED] $failed_count APIs do not meet governance threshold of ${{ env.GOVERNANCE_THRESHOLD }}"
            cat governance-report.json | jq '.[] | select(.status == "FAIL") | "\(.name): \(.score)/100"'
            exit 1
          elif [ "$failed_count" -gt 0 ]; then
            echo "[WARNING] $failed_count APIs do not meet governance threshold of ${{ env.GOVERNANCE_THRESHOLD }} (continuing due to FAIL_ON_GOVERNANCE_VIOLATIONS=false)"
            cat governance-report.json | jq '.[] | select(.status == "FAIL") | "\(.name): \(.score)/100"'
            echo "Governance violations detected but workflow continuing as configured"
          fi
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          
      - name: Generate Governance Dashboard
        if: always()
        run: |
          # Dashboard already generated in previous step
          echo "Dashboard generated successfully"
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          
      - name: Upload Governance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: governance-report.json
          retention-days: 30
          
      - name: Upload Governance Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-dashboard
          path: governance-dashboard.html
          retention-days: 30

      # GitHub Pages Deployment (only on main branch)
      - name: Setup GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Prepare Pages Content
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Create a pages directory and copy dashboard
          mkdir -p _pages
          cp governance-dashboard.html _pages/index.html
          
          # Create a simple README for the Pages site
          cat > _pages/README.md << 'EOF'
          # API Governance Dashboard
          
          This site hosts the latest API governance results from the automated quality checks.
          
          - **Dashboard**: [governance-dashboard.html](./governance-dashboard.html) 
          - **Updated**: $(date)
          - **Repository**: ${{ github.repository }}
          
          ---
          Generated automatically by [API Governance Check](${{ github.server_url }}/${{ github.repository }}/actions)
          EOF
          
          # Also keep the original filename available
          cp governance-dashboard.html _pages/governance-dashboard.html
          
          echo "Pages content prepared in _pages/ directory"
          ls -la _pages/

      - name: Upload Pages Artifact
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages/

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
          
      - name: Send Teams Notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ vars.TEAMS_WEBHOOK_URL }}" ]; then
            export TEAMS_WEBHOOK_URL=${{ vars.TEAMS_WEBHOOK_URL }}
            export BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            node scripts/teams_notifier.js --batch governance-report.json
          else
            echo "TEAMS_WEBHOOK_URL not configured, skipping Teams notification"
          fi
          
      - name: Send Slack Notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ vars.SLACK_WORKFLOW_URL }}" ]; then
            export SLACK_WEBHOOK_URL=${{ vars.SLACK_WORKFLOW_URL }}
            export BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            export BUILD_REQUESTEDFOR="${{ github.actor }}"
            node scripts/slack_notifier.js --batch governance-report.json --workspace ${{ vars.WORKSPACE_ID }}
          else
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification"
          fi
          
      - name: Send Slack Workflow Notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ vars.SLACK_WORKFLOW_URL }}" ]; then
            export SLACK_WEBHOOK_URL=${{ vars.SLACK_WORKFLOW_URL }}
            export BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            export BUILD_REQUESTEDFOR="${{ github.actor }}"
            node scripts/slack_notifier.js --workflow --batch governance-report.json --workspace ${{ vars.WORKSPACE_ID }}
          else
            echo "SLACK_WORKFLOW_URL not configured, skipping Slack workflow notification"
          fi
          
      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Read the governance report
            let reportData;
            try {
              reportData = JSON.parse(fs.readFileSync('governance-report.json', 'utf8'));
            } catch (error) {
              console.log('Could not read governance report');
              return;
            }
            
            // Calculate stats
            const totalApis = reportData.length;
            const passedApis = reportData.filter(api => api.status === 'PASS').length;
            const failedApis = reportData.filter(api => api.status === 'FAIL').length;
            
            // Format failed APIs list
            const failedApisList = reportData
              .filter(api => api.status === 'FAIL')
              .map(api => `- ${api.name}: ${api.score}/100`)
              .join('\n');
            
            // Create comment body
            const commentBody = `## API Governance Report
            
            **Total APIs Checked:** ${totalApis}
            **Passed:** ${passedApis}
            **Failed:** ${failedApis}
            **Threshold:** ${{ env.GOVERNANCE_THRESHOLD }}/100
            
            ${failedApis > 0 ? `### Failed APIs:\n${failedApisList}\n` : '### All APIs passed governance checks!'}
            
            View the full governance dashboard:
            - [Live Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) (GitHub Pages)
            - [Workflow Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (downloadable files)
            
            ---
            *Generated by API Governance Check*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('API Governance Report')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
            
      - name: Set Job Summary
        if: always()
        run: |
          echo "## API Governance Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f governance-report.json ]; then
            total=$(cat governance-report.json | jq '. | length')
            passed=$(cat governance-report.json | jq '[.[] | select(.status == "PASS")] | length')
            failed=$(cat governance-report.json | jq '[.[] | select(.status == "FAIL")] | length')
            
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total APIs | $total |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $failed |" >> $GITHUB_STEP_SUMMARY
            echo "| Threshold | ${{ env.GOVERNANCE_THRESHOLD }}/100 |" >> $GITHUB_STEP_SUMMARY
            
            if [ "$failed" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed APIs" >> $GITHUB_STEP_SUMMARY
              cat governance-report.json | jq -r '.[] | select(.status == "FAIL") | "- \(.name): \(.score)/100"' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No governance report generated" >> $GITHUB_STEP_SUMMARY
          fi